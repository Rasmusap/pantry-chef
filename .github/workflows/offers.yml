# Bentes køkken — refreshes offers.json every morning.
# build_web.py copies this file into the published site as .github/workflows/offers.yml.
# If a chain's offers can't be read, the last good offers stay in place, the run fails and
# GitHub e-mails the repository owner: that is the signal that a reader in _tools/fetch_offers.js needs fixing.
name: Update offers

on:
  schedule:
    - cron: '23 4 * * *' # every day, about 05:23–06:23 Danish time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: offers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch this week's offers
        id: fetch
        run: |
          set +e
          node _tools/fetch_offers.js .
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Publish the new offers
        run: |
          if git diff --quiet -- offers.json; then echo "No change."; exit 0; fi
          git config user.name "offers-bot"
          git config user.email "offers-bot@users.noreply.github.com"
          git add offers.json
          git commit -m "Update offers"
          git push
      - name: Report problems
        if: steps.fetch.outputs.status != '0'
        run: |
          echo "At least one shop's offers could not be read (see the 'Fetch' step). The app keeps showing the last good offers."
          exit 1
